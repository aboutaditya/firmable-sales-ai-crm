[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migration first, then the app. Alembic is idempotent, so redeploys are safe.
startCommand = "sh -c 'alembic upgrade head && uvicorn sales_intelligence.backend.main:app --host 0.0.0.0 --port ${PORT}'"
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10