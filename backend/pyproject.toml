[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-intelligence"
version = "0.1.0"
description = "Streaming company aggregation and deterministic sales intelligence scoring"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "PyJWT>=2.8,<3",
]

[project.scripts]
sales-intelligence = "sales_intelligence.commands:main"

[tool.setuptools.packages.find]
include = ["sales_intelligence*"]

[tool.setuptools.package-data]
sales_intelligence = ["prompts/*/*.txt"]
